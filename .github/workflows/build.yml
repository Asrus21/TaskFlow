name: Build TaskFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and set project directory
        run: |
          if [ -f "TaskFlow-Android/build.gradle" ]; then
            echo "PROJECT_DIR=TaskFlow-Android" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Grant gradlew permission
        run: chmod +x ${{ env.PROJECT_DIR }}/gradlew || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
