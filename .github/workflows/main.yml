name: Build TaskFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Show project structure
        run: find . -name "build.gradle" | head -20

      - name: Build Debug APK
        run: |
          BUILD_DIR=$(find . -name "build.gradle" -path "*/app/build.gradle" | head -1 | xargs dirname | xargs dirname)
          echo "Building in: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle assembleDebug

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-debug
          path: "**/*.apk"
